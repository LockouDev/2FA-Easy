name: Gerar instalador Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-installer:
    runs-on: windows-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Instalar Bun
        uses: oven-sh/setup-bun@v2

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Instalar dependências
        run: bun install

      - name: Gerar instalador NSIS
        run: bun tauri build --bundles nsis
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      - name: Criar metadados da atualização
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $Installer = Get-ChildItem "src-tauri/target/release/bundle/nsis/*-setup.exe" | Select-Object -First 1
          if (-not $Installer) { throw "Instalador NSIS não encontrado" }
          $Signature = (Get-Content -Raw "$($Installer.FullName).sig").Trim()
          $Tag = $env:GITHUB_REF_NAME
          $Latest = [ordered]@{
            version = $Tag.TrimStart("v")
            notes = "Atualização do 2FA Easy"
            pub_date = (Get-Date).ToUniversalTime().ToString("o")
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                url = "https://github.com/${{ github.repository }}/releases/download/$Tag/$($Installer.Name)"
                signature = $Signature
              }
            }
          }
          $Latest | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 "src-tauri/target/release/bundle/nsis/latest.json"

      - name: Guardar instalador
        uses: actions/upload-artifact@v4
        with:
          name: 2FA-Easy-Windows-Installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
            src-tauri/target/release/bundle/nsis/latest.json
          if-no-files-found: error

      - name: Publicar Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/nsis/*-setup.exe.sig
            src-tauri/target/release/bundle/nsis/latest.json
